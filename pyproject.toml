[project]
name = "req2test"
version = "1.0.0"
description = "An LLM agent that turns user stories and acceptance criteria into prioritized test cases, Gherkin features and a traceability matrix."
authors = [{ name = "Harika Modali" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
req2test = "req2test.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
